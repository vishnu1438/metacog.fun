<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brain Teasers</title>
<style>
  :root {
    --bg: #000000;
    --tile: #1a1a1a;
    --tile-hover: #262626;
    --text: #f2f2f2;
    --muted: #8a8a8a;
    --border: #2c2c2c;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  /* Grid of game tiles. Add more <a class="tile"> items here later —
     three fit per row on a normal-width screen, and it wraps automatically. */
  .tile-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 20px;
    max-width: 700px;
    margin: 40px 0;
    padding: 0 24px;
    justify-content: start;
  }

  a.tile {
    display: flex;
    align-items: center;
    justify-content: center;
    aspect-ratio: 1 / 1;
    background: var(--tile);
    border: 1px solid var(--border);
    border-radius: 14px;
    color: var(--text);
    text-decoration: none;
    font-size: 22px;
    font-weight: 700;
    text-align: center;
    padding: 16px;
    transition: background 0.15s ease, transform 0.1s ease;
  }

  a.tile:hover {
    background: var(--tile-hover);
    transform: translateY(-2px);
  }

  a.tile:active {
    transform: translateY(0);
  }
</style>
</head>
<body>

  <div class="tile-grid" id="tile-grid">
    <!-- Same-tab navigation (no target="_blank"). Copy this <a> block to add more games later. -->
    <a class="tile" href="index.html">Speed Math</a>
    <a class="tile" href="home.html?game=cognitive-clash">Cognitive Clash</a>
  </div>

  <script>
    // Cognitive Clash "page": home.html?game=cognitive-clash loads stroop.js in place of the tiles.
    (function () {
      var game = new URLSearchParams(location.search).get("game");
      if (game !== "cognitive-clash") return;
      document.title = "Cognitive Clash | Brain Teasers";
      document.getElementById("tile-grid").style.display = "none";
      var root = document.createElement("div");
      root.id = "stroop-root";
      document.body.appendChild(root);
      var s = document.createElement("script");
      s.src = "stroop.js";
      document.body.appendChild(s);
    })();
  </script>

</body>
</html>
