# /etc/nginx/sites-available/speedmath
# Install:
#   sudo cp nginx-speedmath.conf /etc/nginx/sites-available/speedmath
#   sudo ln -s /etc/nginx/sites-available/speedmath /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
# Run certbot AFTER this is enabled - it edits this file to add SSL automatically:
#   sudo certbot --nginx -d metacog.fun -d www.metacog.fun

# Per-IP request limit for the API (5 req/s sustained, bursts of 20).
# This directive lives at http{} level, which is where this file is included.
limit_req_zone $binary_remote_addr zone=speedmath_api:10m rate=5r/s;

server {
    listen 80;
    listen [::]:80;
    server_name metacog.fun www.metacog.fun;

    server_tokens off;

    root /var/www/speedmath/frontend;
    index home.html;

    gzip on;
    gzip_min_length 256;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /favicon.ico {
        access_log off;
        return 204;
    }

    location / {
        try_files $uri $uri/ =404;
        # "no-cache" = browser revalidates each time (cheap 304), so updates
        # to script.js / style.css show up immediately after a deploy.
        expires -1;
    }

    location /api/ {
        limit_req zone=speedmath_api burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}