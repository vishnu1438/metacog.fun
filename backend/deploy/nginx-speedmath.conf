# /etc/nginx/sites-available/speedmath
# After copying: sudo ln -s /etc/nginx/sites-available/speedmath /etc/nginx/sites-enabled/
# Then: sudo nginx -t && sudo systemctl reload nginx
# Run certbot AFTER this is enabled — it edits this file to add SSL automatically.

server {
    listen 80;
    server_name yourdomain.com www.yourdomain.com;

    root /var/www/speedmath/frontend;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}